<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Curve</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f5f7;
    --text: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --grid: #eef0f3;
    --grid-major: #d8dce1;
    --axis: #8c959f;
    --accent: #0969da;
    --error: #cf222e;
    --warning: #9a6700;
    --band: rgba(9, 105, 218, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --panel: #26282c;
      --text: #e6e6e6;
      --muted: #9da5ae;
      --border: #3d4148;
      --grid: #2a2c30;
      --grid-major: #383b41;
      --axis: #7d8590;
      --accent: #4c9aff;
      --error: #ff7b72;
      --warning: #d29922;
      --band: rgba(76, 154, 255, 0.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.4 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; overflow: hidden; }
  input, select, button { font: inherit; }
  select, .field input { width: 100%; padding: 3px 5px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); }
  button { padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg);
    color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  .hint { color: var(--muted); font-size: 11px; }

  /* ---- Left: functions ---- */
  #sidebar { width: 330px; min-width: 260px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border); }
  #listActions { padding: 6px 8px; display: flex; gap: 6px; }
  #listActions select { flex: 1; min-width: 0; }
  #listActions #moreMenu { flex: 0 0 64px; }
  .list-head, .curve-row { display: grid; grid-template-columns: 34px 1fr 34px 34px 34px; align-items: center; }
  .list-head { padding: 2px 8px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--border); }
  .list-head span { text-align: center; }
  .list-head span:nth-child(2) { text-align: left; }
  #curveList { flex: 0 1 auto; max-height: 34%; overflow-y: auto; border-bottom: 1px solid var(--border); }
  .curve-row { padding: 3px 8px; cursor: pointer; }
  .curve-row:hover { background: var(--grid); }
  .curve-row.selected { background: var(--grid-major); }
  .cell { text-align: center; }
  .curve-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .curve-name span:not(.swatch):not(.badge) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .badge { font-size: 10px; padding: 0 4px; border-radius: 3px; flex: none; }
  .badge.error { color: var(--error); border: 1px solid var(--error); }
  .badge.warning { color: var(--warning); border: 1px solid var(--warning); }

  #editor { flex: 1; overflow-y: auto; padding: 8px; }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .editor-head h3 { margin: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { margin: 10px 0 6px; font-weight: 600; border-top: 1px solid var(--border); padding-top: 8px; }
  .field { margin-bottom: 7px; }
  .field label { display: block; color: var(--muted); margin-bottom: 2px; }
  .field input[type=text] { font-family: Consolas, "SF Mono", Menlo, monospace; }
  .row3 { display: flex; gap: 6px; }
  .row3 .field { flex: 1; min-width: 0; }
  .var { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
  .var-head { display: flex; align-items: center; gap: 6px; }
  .var-name { flex: 1; font-weight: 600; font-family: Consolas, "SF Mono", Menlo, monospace; }
  .var input[type=number], .add-var input { padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); min-width: 0; }
  .var-value { width: 90px; text-align: right; }
  .var input[type=range] { width: 100%; margin: 6px 0 4px; }
  .var-range { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
  .var-range .range-input { width: 0; flex: 1; text-align: right; }
  .add-var { display: flex; gap: 4px; margin-bottom: 8px; }
  .add-var .new-var-name { width: 0; flex: 1.2; }
  .add-var .new-var-value { width: 0; flex: 1; }
  button.icon { padding: 0 7px; line-height: 20px; }
  button.danger { color: var(--error); }
  button.quick { margin-top: 4px; padding: 2px 8px; }
  .messages div { margin-top: 4px; }
  .messages .error, #sketchStatus .error { color: var(--error); }
  .messages .warning, #sketchStatus .warning { color: var(--warning); }

  /* ---- Right: graph and sketch bar ---- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #graphArea { flex: 1; position: relative; min-height: 200px; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  #toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  #readout { position: absolute; left: 8px; bottom: 6px; color: var(--muted);
    font-family: Consolas, "SF Mono", Menlo, monospace; pointer-events: none; }
  #status { position: absolute; left: 8px; top: 8px; right: 230px; color: var(--muted); pointer-events: none;
    background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  #status:empty { display: none; }
  #status.error { color: var(--error); }
  #offline { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
    color: var(--muted); padding: 24px; text-align: center; }

  #sketchBar { border-top: 1px solid var(--border); background: var(--panel); padding: 8px 10px;
    display: grid; grid-template-columns: minmax(260px, 1.1fr) minmax(220px, 1fr); gap: 6px 14px; }
  .bar-title { font-weight: 600; margin-bottom: 4px; }
  .placement-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #placement { flex: 1 1 100%; color: var(--muted); }
  .settings-row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-end; flex-wrap: wrap; }
  .settings-row .field { margin: 0; }
  .settings-row .narrow { width: 74px; }
  .settings-row .unit { width: 92px; }
  .settings-row .output { width: 170px; }
  label.check { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  #sketchStatus { height: 64px; overflow-y: auto; font-size: 11px; border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; background: var(--bg); }
  .create-row { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 6px; }
  #createCurves { padding: 6px 18px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="listActions">
    <select id="addMenu" title="Add a new function or a preset"></select>
    <select id="moreMenu" title="More">
      <option value="">More</option>
      <option value="export">Export library...</option>
      <option value="import">Import library...</option>
      <option value="reload">Reload</option>
    </select>
  </div>
  <div class="list-head">
    <span title="Show on the graph and create in the sketch">Draw</span>
    <span>Function</span>
    <span title="Start from the other end of the baseline">InvO</span>
    <span title="Flip the x direction">InvX</span>
    <span title="Flip the y direction">InvY</span>
  </div>
  <div id="curveList"></div>
  <div id="editor"><p class="hint">Select a function to edit it.</p></div>
</div>
<div id="main">
  <div id="graphArea">
    <canvas id="canvas"></canvas>
    <div id="toolbar">
      <button id="zoomOut" type="button" title="Zoom out">−</button>
      <button id="zoomIn" type="button" title="Zoom in">+</button>
      <button id="fit" type="button" title="Fit the Draw-checked functions">Fit</button>
      <button id="home" type="button" title="Center on the origin">Origin</button>
    </div>
    <div id="status"></div>
    <div id="readout"></div>
    <div id="offline">This window works inside Autodesk Fusion. Open it with Math Curve Sketch.</div>
  </div>
  <div id="sketchBar">
    <div>
      <div class="bar-title">Place in sketch</div>
      <div class="placement-row">
        <span id="placement">Not set.</span>
        <button id="selectLine" type="button" title="Pick a sketch line in Fusion: its start is the origin, its direction is +x">Select line</button>
        <button id="useOrigin" type="button" title="Use the origin and X axis of the sketch being edited">Sketch origin</button>
        <button id="clearPlacement" type="button" title="Forget the baseline">Clear</button>
        <label class="check" title="Show the curves on the baseline in the Fusion viewport"><input id="preview" type="checkbox" checked> Preview in Fusion</label>
      </div>
      <div class="settings-row">
        <div class="field unit"><label for="unit">Unit</label><select id="unit"></select></div>
        <div class="field narrow"><label for="xStart">x from</label><input id="xStart" type="number" step="any"></div>
        <div class="field narrow"><label for="xEnd">x to</label><input id="xEnd" type="number" step="any"></div>
        <div class="field output"><label for="output">Output</label>
          <select id="output">
            <option value="light">Light curve (fast)</option>
            <option value="editable">Editable fit-point spline (slow)</option>
          </select>
        </div>
      </div>
    </div>
    <div>
      <div class="bar-title">Status</div>
      <div id="sketchStatus"></div>
      <div class="create-row">
        <label class="check" title="Create even though there are warnings"><input id="ack" type="checkbox" disabled> Draw anyway</label>
        <button id="createCurves" type="button" disabled>Create Curves</button>
      </div>
    </div>
  </div>
</div>
<script src="graph.js"></script>
</body>
</html>
